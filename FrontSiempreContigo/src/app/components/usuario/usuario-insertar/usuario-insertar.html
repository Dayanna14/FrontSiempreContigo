<div class="container">
  <div class="title-section">
    <h2>Registrar Usuario</h2>
  </div>

  <form [formGroup]="form" (submit)="aceptar()" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput formControlName="username" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Contraseña</mat-label>
      <input matInput [type]="passwordVisible ? 'text' : 'password'" formControlName="contrasena" />
      <mat-icon matSuffix (click)="passwordVisible = !passwordVisible" style="cursor: pointer;">
        {{passwordVisible ? 'visibility_off' : 'visibility'}}
      </mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>DNI</mat-label>
      <input matInput formControlName="dni" maxlength="8" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha de Nacimiento</mat-label>
      <input matInput type="date" formControlName="fechaNacimiento" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellido Paterno</mat-label>
      <input matInput formControlName="apellidoPaterno" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Apellido Materno</mat-label>
      <input matInput formControlName="apellidoMaterno" />
    </mat-form-field>

    <div class="photo-section full-width">
  <p>¿Deseas agregar una foto de perfil?</p>
  
  <mat-radio-group [(ngModel)]="tieneFoto" (change)="onFotoChange()" [ngModelOptions]="{standalone: true}">
    <mat-radio-button [value]="true">Sí</mat-radio-button>
    <mat-radio-button [value]="false">No</mat-radio-button>
  </mat-radio-group>

  @if (tieneFoto) {
    <mat-form-field appearance="outline" class="full-width" style="margin-top: 15px;">
      <mat-label>URL de tu foto</mat-label>
      <input matInput formControlName="fotoPerfil" />
    </mat-form-field>
  }
</div>

    <div class="botones-container full-width">
      <button mat-flat-button color="primary" type="submit">Registrar</button>
      <button mat-stroked-button type="button" routerLink="/usuario">Cancelar</button>
    </div>
  </form>
</div>
