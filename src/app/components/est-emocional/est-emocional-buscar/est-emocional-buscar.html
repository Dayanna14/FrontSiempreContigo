
<div class="container">
  <div style="text-align: center; margin: 5%"><h2>Buscar Historial Emocional por Paciente</h2></div>
  
  <div class="search-container" style="text-align: center; margin-bottom: 3%;">
    <form [formGroup]="form" (submit)="buscar()">
      <mat-form-field style="width: 40%; margin-right: 15px;">
        <mat-label>Escribe el ID del Paciente</mat-label>
        <input matInput formControlName="pacienteId" placeholder="Ej: 2" />
      </mat-form-field>
      <button mat-raised-button color="primary" type="button" (click)="buscar()" [disabled]="form.invalid">Buscar</button>
    </form>
  </div>

  <div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>No. Registro</th>
        <td mat-cell *matCellDef="let element">{{ element.idEstadoEmocional }}</td>
      </ng-container>

      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let element">{{ element.fechaRegistro }}</td>
      </ng-container>

      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>Bienestar</th>
        <td mat-cell *matCellDef="let element">{{ element.nivelBienestar }}</td>
      </ng-container>

      <ng-container matColumnDef="c4">
        <th mat-header-cell *matHeaderCellDef>Emoción</th>
        <td mat-cell *matCellDef="let element">{{ element.tipoEstadoEmocional }}</td>
      </ng-container>

      <ng-container matColumnDef="c5">
        <th mat-header-cell *matHeaderCellDef>Comentario/Observación</th>
        <td mat-cell *matCellDef="let element">{{ element.observacion }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
