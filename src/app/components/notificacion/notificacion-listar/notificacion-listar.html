<div class="container">
  <div class="header-actions">
    <h2>Historial de Notificaciones</h2>
    <button mat-raised-button color="primary" routerLink="/notificacion/nuevo">
      <mat-icon>add</mat-icon> Nueva Notificación
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    
    <!-- ID -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.idNotificacion}} </td>
    </ng-container>

    <!-- Mensaje -->
    <ng-container matColumnDef="mensaje">
      <th mat-header-cell *matHeaderCellDef> Mensaje </th>
      <td mat-cell *matCellDef="let element" class="mensaje-cell"> {{element.mensaje}} </td>
    </ng-container>

    <!-- Fecha Envío -->
    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef> Fecha Envío </th>
      <td mat-cell *matCellDef="let element"> {{element.fechaEnvio | date:'dd/MM/yyyy HH:mm'}} </td>
    </ng-container>

    <!-- Tipo de Notificación -->
    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef> Tipo </th>
      <td mat-cell *matCellDef="let element">
        <span class="tipo-badge">
          {{element.tipoNotificacion || 'SISTEMA'}}
        </span>
      </td>
    </ng-container>

    <!-- Usuario Receptor -->
    <ng-container matColumnDef="usuario">
      <th mat-header-cell *matHeaderCellDef> Destinatario </th>
      <td mat-cell *matCellDef="let element"> 
        {{element.usuario?.username || 'Sin asignar'}}
      </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" [routerLink]="['/notificacion/edits', element.idNotificacion]">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(element.idNotificacion)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
