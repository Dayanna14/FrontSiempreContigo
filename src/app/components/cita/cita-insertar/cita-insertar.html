<h1>Ingresar Cita:</h1>

<div>
  <form [formGroup]="form" (ngSubmit)="aceptar()" class="example-form">
    
    
    

    <mat-form-field class="example-full-width">
      <mat-label>Fecha de la Cita</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fechaCita" placeholder="Elige una fecha">
      <mat-hint>DD/MM/YYYY</mat-hint>
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <br/>

    <mat-form-field class="example-full-width">
      <mat-label>Hora de la Cita</mat-label>
      <input matInput type="time" formControlName="horaCita">
    </mat-form-field>
    <br/>

    <mat-form-field class="example-full-width">
      <mat-label>Motivo de la Cita</mat-label>
      <input matInput formControlName="motivo" placeholder="Ej. Consulta de rutina">
    </mat-form-field>
    <br/>

    <mat-form-field class="example-full-width">
      <mat-label>Estado de la Cita</mat-label>
      <input matInput formControlName="estadoCita" placeholder="Ej. Pendiente">
    </mat-form-field>
    <br/>

<mat-form-field>
        <mat-label>Usuario respectivo:</mat-label>
        <mat-select formControlName="UsuarioN">
          @for (food of listasUsuario; track food) {
            <mat-option [value]="food.idUsuario">{{ food.username }}</mat-option> 
          }
        </mat-select>
</mat-form-field>


    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
      Guardar Cita
    </button>

  </form>
</div>
