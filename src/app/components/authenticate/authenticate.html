<div class="login-wrapper">
  <div class="login-card mat-elevation-z8">
    <div class="login-header">
      <mat-icon class="brand-icon">healing</mat-icon>
      <h2>¡Hola! Te damos la bienvenida a</h2>
      <h1>SiempreContigo</h1>
      <p>Por favor, ingresa a tu cuenta para continuar con tu bienestar.</p>
    </div>

    <form (submit)="login()" class="login-form">
      <mat-form-field appearance="outline">
        <mat-label>Nombre de usuario o Correo</mat-label>
        <input matInput name="username" placeholder="Username" [(ngModel)]="username" required />
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <!-- CORRECCIÓN: type="password" -->
        <input type="password" name="contrasena" matInput placeholder="Contraseña" [(ngModel)]="contrasena" required />
        <mat-icon matSuffix>lock</mat-icon>
      </mat-form-field>

      <!-- CORRECCIÓN: Agregada la clase btn-submit-login de tu CSS -->
      <button mat-raised-button color="primary" type="submit" class="btn-submit-login">Ingresar</button>
    </form>

    <div class="register-link">
      <p>¿Aún no tienes cuenta? 
        <a routerLink="/usuario/nuevo">Regístrate aquí</a>
      </p>
    </div>

    <div class="divider">
      <span>O ingresa usando tus redes sociales</span>
    </div>

    <div class="social-login-group">
      <!-- Opción A: Botón nativo de la librería (más fácil y seguro) -->
      <asl-google-signin-button type="standard" size="medium"></asl-google-signin-button>

      <!-- Si prefieres mantener tu diseño propio (Opción B), 
          cambia (click)="loginWithGoogle()" por esto: -->
      <!--
      <button mat-stroked-button class="btn-google" (click)="authService.signIn('GOOGLE')">
        <img src="https://fonts.gstatic.com/s/i/productlogos/googleg/v6/web-24dp/logo_googleg_color_24dp.png" alt="Google logo" />
        Continuar con Google
      </button>
      -->

      <!-- Elimina o comenta el botón de Facebook si no lo vas a usar -->
    </div>
  </div>
</div>
